<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8f8f4">
  <meta name="description" content="Привычка — превращайте большие цели в маленькие ежедневные шаги. Без давления, с видимым прогрессом.">
  <title>Привычка — один шаг каждый день</title>
  <link rel="icon" type="image/svg+xml" href="assets/icon.svg">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="src/app.js"></script>
</head>
<body>
  <div class="shell">
    <header class="site-header">
      <a href="#today" class="brand" aria-label="Привычка — главная">
        <span class="brand-mark" aria-hidden="true"><svg width="25" height="25" viewBox="0 0 24 24" fill="none"><path d="m5 13 5 5L20 6" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <span>привычка<span class="brand-dot">.</span></span>
      </a>
      <button class="button button-outline small" data-action="new">+ Новая цель</button>
    </header>
    <nav class="tabbar" aria-label="Разделы приложения">
      <button class="tab active" data-tab="today" aria-current="page">Сегодня</button>
      <button class="tab" data-tab="goals">Мои цели</button>
      <button class="tab" data-tab="progress">Прогресс</button>
      <button class="tab" data-tab="about">Как это работает</button>
    </nav>
    <main id="content" tabindex="-1" aria-live="polite"></main>
    <footer class="footer"><span>Маленький шаг лучше идеального плана.</span><button class="link-button" data-action="export">Экспорт</button><button class="link-button" data-action="import">Импорт</button><span class="privacy-label">Данные хранятся только на устройстве</span></footer>
  </div>
  <dialog id="goal-dialog" class="goal-dialog" aria-labelledby="dialog-title">
    <form id="goal-form" novalidate>
      <div class="dialog-head"><div><p class="eyebrow">ПЛАН НАЧИНАЕТСЯ ЗДЕСЬ</p><h2 id="dialog-title">Новая большая цель</h2></div><button type="button" class="icon-button" data-action="close" aria-label="Закрыть окно">✕</button></div>
      <div class="form-body">
        <div class="presets" id="presets"><button class="chip" type="button" data-preset="python">Python</button><button class="chip" type="button" data-preset="language">Язык</button><button class="chip" type="button" data-preset="sport">Спорт</button></div>
        <label class="field"><span>Большая цель <b aria-hidden="true">*</b></span><input name="title" maxlength="100" placeholder="Например, освоить Python" required></label>
        <label class="field"><span>Зачем мне это?</span><input name="reason" maxlength="220" placeholder="Для чего я хочу этого достичь"></label>
        <div class="form-divider">Привычка, которую легко повторять</div>
        <label class="field"><span>После чего я буду действовать? <b aria-hidden="true">*</b></span><input name="trigger" maxlength="100" placeholder="Например, утреннего кофе" required><small>Привяжите действие к уже привычному моменту дня.</small></label>
        <label class="field"><span>Какое маленькое действие сделаю? <b aria-hidden="true">*</b></span><input name="action" maxlength="120" placeholder="Например, занимаюсь 10 минут" required></label>
        <label class="field"><span>Сколько минут в день</span><input name="minutes" type="number" inputmode="numeric" min="1" max="240" value="5" required></label>
        <div class="form-divider">Первый шаг к цели <span class="soft">(достаточно одного, остальные добавите позже)</span></div>
        <div id="step-inputs" class="step-inputs"></div>
        <button type="button" class="button button-outline full" data-action="add-step">+ Добавить шаг</button>
        <p class="form-error" id="form-error" role="alert" hidden></p>
      </div>
      <div class="dialog-footer"><button class="button button-outline" type="button" data-action="close">Отмена</button><button class="button button-primary" type="submit">Сохранить цель</button></div>
    </form>
  </dialog>
  <input id="import-file" type="file" accept="application/json,.json" hidden>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
